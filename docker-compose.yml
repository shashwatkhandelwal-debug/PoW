services:
  target_app:
    build:
      context: .
      dockerfile: Dockerfile.target
    container_name: pow_target_app
    ports:
      - "8000:8000"
    environment:
      - APP_PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 5
    networks:
      - pow_net

  redis:
    image: redis:7-alpine
    container_name: pow_redis
    ports:
      - "6379:6379"
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5
    networks:
      - pow_net

  middleware:
    build:
      context: .
      dockerfile: Dockerfile.middleware
    container_name: pow_middleware
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TARGET_URL=http://target_app:8000
      - MIDDLEWARE_PORT=8080
      - HMAC_SECRET_KEY=${HMAC_SECRET_KEY:-insecure-dev-secret-change-in-prod}
    depends_on:
      redis:
        condition: service_healthy
      target_app:
        condition: service_healthy
    networks:
      - pow_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: pow_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SCORING_INTERVAL_MS=500
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pow_net

  prometheus:
    image: prom/prometheus:latest
    container_name: pow_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pow_net

  grafana:
    image: grafana/grafana:latest
    container_name: pow_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - pow_net

networks:
  pow_net:
    driver: bridge
